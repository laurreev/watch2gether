<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>PBB Live Camera</title>
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.14.10/dist/shaka-player.compiled.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    #player-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      cursor: pointer;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    /* Loading overlay */
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.12);
      border-top-color: #ef4444;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 16px;
      font-size: 13px;
      color: #e2e8f0;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    /* Error / Retry overlay */
    #error-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 20px;
      text-align: center;
    }
    .error-title {
      font-size: 16px;
      font-weight: 700;
      color: #f87171;
      margin-bottom: 6px;
    }
    .error-desc {
      font-size: 12px;
      color: #94a3b8;
      max-width: 320px;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .retry-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .retry-btn:hover {
      background: #dc2626;
    }
    /* Unmute overlay button */
    #unmute-btn {
      display: none;
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 30;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    #unmute-btn:hover {
      background: #ef4444;
      transform: scale(1.04);
    }
    /* Clean controls overlay (Mute, PiP, Fullscreen - NO seek / pause) */
    #controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px 16px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0;
      transition: opacity 0.25s ease;
      z-index: 15;
    }
    #player-container:hover #controls {
      opacity: 1;
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      color: #f87171;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.85); opacity: 0.4; }
    }
    .control-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ctrl-btn {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>
  <div id="player-container">
    <video id="video" autoplay playsinline muted></video>

    <div id="loading-overlay">
      <div class="spinner"></div>
      <div class="loading-text" id="loading-label">Connecting to PBB Live Feed...</div>
    </div>

    <div id="error-overlay">
      <div class="error-title">Signal Interrupted</div>
      <div class="error-desc" id="error-desc">Camera broadcast feed could not be loaded. Please retry or switch cameras.</div>
      <button class="retry-btn" onclick="retryStream(event)">Reconnect</button>
    </div>

    <button id="unmute-btn" onclick="toggleMute(event)">
      🔊 Click to Unmute Audio
    </button>

    <div id="controls">
      <div class="live-badge">
        <span class="live-dot"></span>
        <span id="channel-name">PBB Live</span>
      </div>
      <div class="control-actions">
        <button class="ctrl-btn" id="mute-toggle" onclick="toggleMute(event)" title="Mute/Unmute">🔇</button>
        <button class="ctrl-btn" id="pip-btn" onclick="togglePip(event)" title="Picture in Picture">🔲</button>
        <button class="ctrl-btn" id="fs-btn" onclick="toggleFullscreen(event)" title="Fullscreen">⛶</button>
      </div>
    </div>
  </div>

  <script>
    const AKAMAI = "https://absp-live.akamaized.net";
    const CHANNELS = {
      all: {
        name: "Cam 1 — All Access (Living Area)",
        dash: AKAMAI + "/dash/live/2099522/pbbcollab30allaccesslivestream/manifest.mpd",
        hls: AKAMAI + "/hls/live/2099522/pbbcollab30allaccesslivestream/master.m3u8",
        kid: "8150b74d16324bb4b2ff62e3e202fc7a",
        key: "0c5ed4f9db9d4ee61bbc91b3a51ef8b5"
      },
      ext: {
        name: "Cam 2 — External Den (Garden & Pool)",
        dash: AKAMAI + "/dash/live/2099522/pbbcollab30allaccesslivestream-externalden/manifest.mpd",
        hls: AKAMAI + "/hls/live/2099522/pbbcollab30allaccesslivestream-externalden/master.m3u8",
        kid: "b750a40736a24e60b5a4f256208b92c5",
        key: "af07292597f692726dcac2bd297ddf8e"
      },
      din: {
        name: "Cam 3 — Dining Area & Kitchen",
        dash: AKAMAI + "/dash/live/2099522/pbbcollab30allaccesslivestream-diningarea/manifest.mpd",
        hls: AKAMAI + "/hls/live/2099522/pbbcollab30allaccesslivestream-diningarea/master.m3u8",
        kid: "ea6588d030c94ca89925ac0c49974430",
        key: "3e6de4afee1eff8e14f9506b76ac9ee6"
      },
      main: {
        name: "Cam 4 — PBB Collab 3.0 Live Broadcast",
        dash: AKAMAI + "/dash/live/2099522/pinoybigbrothercollabedition30live/manifest.mpd",
        hls: AKAMAI + "/hls/live/2099522/pinoybigbrothercollabedition30live/master.m3u8",
        kid: "1044e7ece2d741bcafe80d8613da104f",
        key: "f5e17f169ff05ea40c5d3f065f523942"
      }
    };

    CHANNELS['pbb-cam-1'] = CHANNELS['all'];
    CHANNELS['pbb-cam-2'] = CHANNELS['ext'];
    CHANNELS['pbb-cam-3'] = CHANNELS['din'];
    CHANNELS['pbb-cam-4'] = CHANNELS['main'];

    const params = new URLSearchParams(location.search);
    const chParam = (params.get('ch') || 'all').toLowerCase();
    const channel = CHANNELS[chParam] || CHANNELS['all'];

    document.getElementById('channel-name').textContent = channel.name;

    const video = document.getElementById('video');
    const loadingOverlay = document.getElementById('loading-overlay');
    const errorOverlay = document.getElementById('error-overlay');
    const errorDesc = document.getElementById('error-desc');
    const unmuteBtn = document.getElementById('unmute-btn');
    const muteToggle = document.getElementById('mute-toggle');

    let player = null;
    let isPlaying = false;

    // Start muted by default to guarantee instant autoplay without browser blocks
    video.muted = true;

    function showLoading(msg) {
      if (msg) document.getElementById('loading-label').textContent = msg;
      loadingOverlay.style.display = 'flex';
      loadingOverlay.style.opacity = '1';
    }

    function hideLoading() {
      // Only hide when video is genuinely playing and advancing frames
      if (video.readyState >= 3 && video.currentTime > 0.05 && !video.paused) {
        isPlaying = true;
        loadingOverlay.style.opacity = '0';
        setTimeout(() => {
          if (video.readyState >= 3 && !video.paused) {
            loadingOverlay.style.display = 'none';
          }
        }, 200);

        if (video.muted) {
          unmuteBtn.style.display = 'flex';
          muteToggle.textContent = '🔇';
        } else {
          unmuteBtn.style.display = 'none';
          muteToggle.textContent = '🔊';
        }
        try {
          window.parent.postMessage({ type: 'playerReady', channel: chParam }, '*');
        } catch(e) {}
      }
    }

    video.addEventListener('timeupdate', () => {
      if (video.currentTime > 0.05 && video.readyState >= 3 && !video.paused) {
        hideLoading();
      }
    });

    video.addEventListener('playing', () => {
      if (video.currentTime > 0.05 && video.readyState >= 3) {
        hideLoading();
      }
    });

    video.addEventListener('waiting', () => {
      showLoading('Buffering live feed...');
    });

    video.addEventListener('stalled', () => {
      showLoading('Buffering live feed...');
    });

    async function initApp() {
      shaka.polyfill.installAll();
      if (!shaka.Player.isBrowserSupported()) {
        showError("Your browser does not support Shaka Player with encrypted media extensions.");
        return;
      }

      player = new shaka.Player(video);
      player.addEventListener('error', onPlayerErrorEvent);

      player.addEventListener('buffering', (event) => {
        if (event.buffering) {
          showLoading('Buffering live feed...');
        } else {
          hideLoading();
        }
      });

      player.getNetworkingEngine().registerRequestFilter((type, request) => {
        delete request.headers['Referer'];
        delete request.headers['referer'];
      });

      // Rock-solid streaming config:
      // safeSeekOffset: 5 starts safely in cached Akamai window, avoiding in-progress live segment race conditions
      // stallEnabled + smallGapLimit automatically jumps over any timestamp gap
      player.configure({
        drm: {
          clearKeys: {
            [channel.kid]: channel.key
          }
        },
        streaming: {
          bufferingGoal: 8,
          rebufferingGoal: 2,
          bufferBehind: 15,
          safeSeekOffset: 5,
          startAtSegmentBoundary: true,
          stallEnabled: true,
          stallThreshold: 1,
          stallSkip: 0.5,
          smallGapLimit: 1.5,
          jumpLargeGaps: true,
          retryParameters: {
            maxAttempts: 5,
            baseDelay: 500,
            backoffFactor: 1.5,
            fuzzFactor: 0.3,
            timeout: 10000
          }
        },
        manifest: {
          dash: {
            autoCorrectDrift: true,
            ignoreMinBufferTime: true
          }
        }
      });

      // Prevent seeking/rewinding on live stream
      video.addEventListener('seeking', () => {
        if (player && player.isLive()) {
          const seekRange = player.seekRange();
          if (seekRange && seekRange.end) {
            video.currentTime = Math.max(seekRange.start, seekRange.end - 5);
          }
        }
      });

      await loadStream();
      startWatchdog();
    }

    async function loadStream() {
      showLoading("Connecting to PBB Live Feed...");
      errorOverlay.style.display = 'none';

      try {
        await player.load(channel.dash);
        video.muted = true;
        await video.play().catch((err) => {
          console.warn("Autoplay blocked, ensuring muted playback...", err);
          video.muted = true;
          return video.play();
        });
      } catch (err) {
        console.warn("Direct DASH load failed, trying proxy stream...", err);
        try {
          const proxyUrl = '/api/tv/proxy?url=' + encodeURIComponent(channel.dash);
          await player.load(proxyUrl);
          video.muted = true;
          await video.play().catch(() => {
            video.muted = true;
            return video.play();
          });
        } catch (proxyErr) {
          console.error("Proxied load failed as well:", proxyErr);
          showError("Unable to establish connection to Kuya's live camera feed. (Error: " + (err.message || err.code || 'Playback error') + ")");
        }
      }
    }

    // Active playback watchdog: monitors video progression every second.
    // If video is stuck on black or in gap, automatically unstalls by nudging currentTime or restarting.
    function startWatchdog() {
      let lastCurrentTime = 0;
      let lastProgressTime = Date.now();

      setInterval(() => {
        if (!player) return;

        const now = Date.now();
        if (!video.paused && video.currentTime > lastCurrentTime + 0.1) {
          lastCurrentTime = video.currentTime;
          lastProgressTime = now;
          hideLoading();
          return;
        }

        // If video is supposed to be playing but has not progressed for > 2.5 seconds
        if (now - lastProgressTime > 2500) {
          showLoading("Syncing live broadcast...");

          if (video.paused) {
            video.play().catch(() => {});
          }

          if (player.isLive()) {
            const seekRange = player.seekRange();
            if (seekRange && seekRange.end) {
              const target = Math.max(seekRange.start, seekRange.end - 5);
              if (Math.abs(video.currentTime - target) > 1.5) {
                video.currentTime = target;
              }
            }
          }
        }

        // If stuck for > 6.5 seconds, cleanly reconnect
        if (now - lastProgressTime > 6500) {
          lastProgressTime = now;
          loadStream();
        }
      }, 1000);
    }

    function onPlayerErrorEvent(event) {
      console.error('Shaka Error:', event.detail);
      showError("Stream error: " + (event.detail.message || "Decryption or network error"));
    }

    function showError(msg) {
      loadingOverlay.style.display = 'none';
      errorOverlay.style.display = 'flex';
      errorDesc.textContent = msg;
    }

    function retryStream(e) {
      if (e) e.stopPropagation();
      errorOverlay.style.display = 'none';
      showLoading("Reconnecting to PBB Live Feed...");
      loadStream();
    }

    function toggleMute(e) {
      if (e) e.stopPropagation();
      video.muted = !video.muted;
      unmuteBtn.style.display = video.muted ? 'flex' : 'none';
      muteToggle.textContent = video.muted ? '🔇' : '🔊';
      if (!video.muted && video.paused) {
        video.play().catch(() => {});
      }
    }

    function togglePip(e) {
      if (e) e.stopPropagation();
      if (document.pictureInPictureElement) {
        document.exitPictureInPicture().catch(() => {});
      } else if (video.requestPictureInPicture) {
        video.requestPictureInPicture().catch(() => {});
      }
    }

    function toggleFullscreen(e) {
      if (e) e.stopPropagation();
      const container = document.getElementById('player-container');
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // Click anywhere on player to play or toggle audio
    document.getElementById('player-container').addEventListener('click', (e) => {
      if (e.target.closest('button')) return;
      if (video.paused) {
        video.play().catch(() => {});
      } else if (video.muted) {
        toggleMute();
      }
    });

    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'mute') {
        video.muted = true;
        unmuteBtn.style.display = 'flex';
        muteToggle.textContent = '🔇';
      } else if (data.type === 'unmute') {
        video.muted = false;
        unmuteBtn.style.display = 'none';
        muteToggle.textContent = '🔊';
        if (video.paused) video.play().catch(() => {});
      } else if (data.type === 'volume' && typeof data.value === 'number') {
        video.volume = Math.max(0, Math.min(1, data.value));
      } else if (data.type === 'play') {
        video.play().catch(() => {});
      }
    });

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
